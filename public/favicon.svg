<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="gWide" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.6"></feGaussianBlur></filter>
    <filter id="gTight" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="1.1"></feGaussianBlur></filter>
  </defs>
  <g filter="url(#gWide)"><line class="halo" x1="8" y1="24" x2="24" y2="8" stroke="#ff2f45" stroke-width="5" stroke-linecap="round"></line></g>
  <g filter="url(#gTight)"><line class="halo" x1="8" y1="24" x2="24" y2="8" stroke="#ff2f45" stroke-width="4" stroke-linecap="round"></line></g>
  <line class="core" x1="8" y1="24" x2="24" y2="8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"></line>
  <style>
    @media (prefers-color-scheme: light) {
      .halo { stroke: #1E5FCB; }
      .core { stroke: #C7DBFA; }
    }
  </style>
</svg>
